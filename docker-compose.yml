version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Sentinel Supply Chain Agent
      - APP_VERSION=2.0.0
      - DEBUG=False
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
    volumes:
      - ./backend:/app
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./sentinel-supply-chain-v2
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_FASTAPI_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinel-net
    volumes:
      - ./sentinel-supply-chain-v2:/app
      - /app/.next

networks:
  sentinel-net:
    driver: bridge

volumes:
  backend-data:
  frontend-data:
